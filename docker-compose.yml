services:
  # ---- 缓存 ----
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: relationship-redis
    restart: always
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- HTTPS 反向代理 ----
  caddy:
    image: docker.m.daocloud.io/library/caddy:2-alpine
    container_name: relationship-caddy
    restart: always
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
