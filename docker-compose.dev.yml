name: relationship-dev

services:
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: relationship-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - relationship_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relationship_dev_redis_data:
